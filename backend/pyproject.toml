[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon and the sandbox images"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: long prompt strings; B008: FastAPI Depends() idiom
ignore = ["E501", "B008"]
